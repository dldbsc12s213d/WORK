<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>업무 계획 및 일지 관리 (Notion Style)</title>
    <style>
        /* Notion 스타일 변수 및 기본 설정 */
        :root {
            --text-main: #37352f;
            --text-gray: #787774;
            --bg-main: #ffffff;
            --bg-hover: #efefef;
            --border-color: #e9e9e7;
            --primary: #2383e2;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, "Apple Color Emoji", Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
            color: var(--text-main);
            background-color: var(--bg-main);
            line-height: 1.5;
            margin: 0;
            padding: 40px 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        /* 타이포그래피 */
        h1 { font-size: 40px; font-weight: 700; margin-bottom: 30px; letter-spacing: -0.03em; }
        h2 { font-size: 24px; font-weight: 600; margin-top: 40px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px;}
        
        /* 버튼 스타일 */
        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        .btn:hover { background-color: #0066cc; }
        .btn-outline { background-color: transparent; border: 1px solid var(--border-color); color: var(--text-main); }
        .btn-outline:hover { background-color: var(--bg-hover); }

        /* 텍스트 입력창 */
        textarea {
            width: 100%;
            height: 200px;
            padding: 16px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-family: inherit;
            font-size: 15px;
            resize: vertical;
            background-color: #fbfbfa;
            box-sizing: border-box;
            outline: none;
        }
        textarea:focus { border-color: rgba(35, 131, 226, 0.5); box-shadow: 0 0 0 2px rgba(35, 131, 226, 0.2); }

        /* 노션 스타일 블록 (Task Board) */
        .project-block { margin-top: 24px; }
        .project-title { font-size: 18px; font-weight: 600; padding: 6px 0; color: var(--text-main); }
        
        .task-card {
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 16px;
            margin: 12px 0 12px 16px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.03);
        }
        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 12px;
        }
        .progress-control {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            color: var(--text-gray);
        }
        input[type="range"] { accent-color: var(--primary); cursor: pointer; }
        
        .subtask-list { margin-top: 12px; padding-left: 8px; }
        .subtask-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px;
            border-radius: 4px;
            font-size: 15px;
        }
        .subtask-item:hover { background-color: var(--bg-hover); }
        .subtask-item::before { content: "•"; color: var(--text-gray); margin-right: 8px; }
        
        select {
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            background: white;
            font-size: 13px;
            color: var(--text-main);
            cursor: pointer;
            outline: none;
        }
        select:focus { border-color: var(--primary); }

        /* 컨트롤 패널 영역 */
        .action-panel {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 16px;
        }

        /* 결과창 영역 */
        #resultSection { display: none; margin-top: 40px; }
    </style>
</head>
<body>

<div class="container">
    <h1 id="pageTitle">업무 계획 및 일지</h1>

    <!-- 1. 입력 영역 -->
    <div id="inputSection">
        <p style="color: var(--text-gray); font-size: 15px; margin-bottom: 10px;">
            텍스트 양식에 맞춰 오늘 할 일을 입력하세요. (예: [사업명] 엔터 / 1. 업무명 엔터 / - 세부작업)
        </p>
        <textarea id="rawInput" placeholder="[경북대 IP명품 콘텐츠]
1. IP명품 지식재산 배경지 제작
- 검토후 obs 삽입

[내부업무]
1. 유튜브 자체 컨텐츠 제작 진행
- 나레이션 작업
- ai 영상 구현
- 제작 후 업로드 진행"></textarea>
        
        <div class="action-panel">
            <button class="btn" onclick="transformToBlocks()">블록으로 변환하기 ➔</button>
        </div>
    </div>

    <!-- 2. 변환된 보드 영역 (노션 스타일 블록) -->
    <div id="boardSection" style="display: none;">
        <div class="action-panel" style="justify-content: space-between; align-items: center; border-bottom: 1px solid #e9e9e7; padding-bottom: 10px;">
            <span style="font-weight: 600; color: var(--text-gray);">✓ 업무 트래커</span>
            <div>
                <button class="btn btn-outline" onclick="editRawText()">기존 텍스트 수정</button>
                <button class="btn" onclick="generateFinalLog()">오늘의 일지 쓰기 ➔</button>
            </div>
        </div>
        <div id="blockContainer"></div>
    </div>

    <!-- 3. 결과 및 익일 업무 작성 영역 -->
    <div id="resultSection">
        <h2>일지 출력 및 익일 예정 업무</h2>
        <textarea id="finalOutput" style="height: 400px; font-family: monospace;"></textarea>
    </div>
</div>

<script>
    // 날짜 포맷팅 함수 (YYYY-MM-DD)
    function getFormattedDate(offsetDays = 0) {
        const d = new Date();
        d.setDate(d.getDate() + offsetDays);
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${day}`;
    }

    const todayStr = getFormattedDate(0);
    const tomorrowStr = getFormattedDate(1);
    
    // 제목에 오늘 날짜 세팅
    document.getElementById('pageTitle').innerText = `${todayStr} 업무 일지`;

    let parsedData = [];

    // 1. 텍스트를 인식하여 데이터로 변환 (파싱 로직 수정됨)
    function transformToBlocks() {
        const text = document.getElementById('rawInput').value;
        // 정규식을 사용해 줄바꿈 문자를 완벽하게 분리
        const lines = text.split(/\r?\n/);
        
        parsedData = [];
        let currentProj = null;
        let currentTask = null;

        for (let i = 0; i < lines.length; i++) {
            const line = lines[i].trim();
            if (!line) continue; // 빈 줄 무시

            // [사업명] 인식
            if (line.startsWith('[') && line.endsWith(']')) {
                currentProj = { title: line, tasks: [] };
                parsedData.push(currentProj);
            } 
            // 1. 업무명 인식
            else if (/^\d+\./.test(line)) {
                currentTask = { title: line, progress: 0, subtasks: [] };
                if (currentProj) currentProj.tasks.push(currentTask);
            } 
            // - 세부 작업 인식
            else if (line.startsWith('-')) {
                if (currentTask) currentTask.subtasks.push({ title: line, status: '대기' });
            }
        }

        if (parsedData.length === 0) {
            alert("인식할 수 있는 데이터가 없습니다. 양식을 확인해주세요.");
            return;
        }

        renderBlocks();
        document.getElementById('inputSection').style.display = 'none';
        document.getElementById('boardSection').style.display = 'block';
        document.getElementById('resultSection').style.display = 'none';
    }

    // 2. 파싱된 데이터를 UI 블록으로 렌더링
    function renderBlocks() {
        const container = document.getElementById('blockContainer');
        container.innerHTML = '';

        parsedData.forEach((proj, pIdx) => {
            let html = `<div class="project-block"><div class="project-title">${proj.title}</div>`;
            
            proj.tasks.forEach((task, tIdx) => {
                let subHtml = task.subtasks.map((sub, sIdx) => `
                    <div class="subtask-item">
                        <span style="flex:1;">${sub.title}</span>
                        <select id="status_${pIdx}_${tIdx}_${sIdx}" onchange="syncProgress(${pIdx}, ${tIdx})">
                            <option value="대기" selected>대기</option>
                            <option value="진행 중">진행 중</option>
                            <option value="완료">완료</option>
                        </select>
                    </div>
                `).join('');

                html += `
                    <div class="task-card">
                        <div class="task-header">
                            <span>${task.title}</span>
                            <div class="progress-control">
                                <input type="range" id="prog_${pIdx}_${tIdx}" min="0" max="100" step="10" value="0" 
                                       oninput="document.getElementById('progText_${pIdx}_${tIdx}').innerText = this.value + '%'">
                                <span id="progText_${pIdx}_${tIdx}" style="width: 40px; text-align: right; font-weight:bold; color: var(--primary);">0%</span>
                            </div>
                        </div>
                        <div class="subtask-list">
                            ${subHtml}
                        </div>
                    </div>
                `;
            });
            html += `</div>`;
            container.innerHTML += html;
        });
    }

    // 다시 입력창으로 돌아가는 함수
    function editRawText() {
        document.getElementById('boardSection').style.display = 'none';
        document.getElementById('resultSection').style.display = 'none';
        document.getElementById('inputSection').style.display = 'block';
    }

    // 하위 작업(완료) 갯수에 따라 슬라이더 자동 동기화 보조 함수 (선택적 기능)
    function syncProgress(pIdx, tIdx) {
        // 이 기능은 사용자가 수동으로 슬라이더를 조절할 수 있도록 냅둡니다.
    }

    // 3. 오늘의 일지 및 익일 업무 생성 로직
    function generateFinalLog() {
        let finalLog = "";
        let tomorrowText = "\n[익일예정업무]\n";
        let hasIncomplete = false;

        parsedData.forEach((proj, pIdx) => {
            let projHasData = false;
            let tempLog = `${proj.title}\n`;
            
            proj.tasks.forEach((task, tIdx) => {
                projHasData = true;
                const progress = document.getElementById(`prog_${pIdx}_${tIdx}`).value;
                
                // 날짜 로직: 100%면 마감 오늘, 아니면 내일
                let dateStr = "";
                if (progress === "100") {
                    dateStr = `시작 ${todayStr} / 마감 ${todayStr}`;
                } else {
                    dateStr = `시작 ${todayStr} / 마감 (완료 예정) ${tomorrowStr}`;
                    // 미완료 업무 익일로 복사
                    tomorrowText += `${task.title}\n`;
                    hasIncomplete = true;
                }

                tempLog += `${task.title} ${progress}%\n${dateStr}\n`;

                task.subtasks.forEach((sub, sIdx) => {
                    const status = document.getElementById(`status_${pIdx}_${tIdx}_${sIdx}`).value;
                    // '- 검토 완료' 형태로 합치기 (기존 - 기호 뒤에 상태 붙임)
                    tempLog += `${sub.title} ${status}\n`;
                    
                    // 세부 항목도 미완료면 익일로 복사
                    if (progress !== "100" && status !== '완료') {
                        tomorrowText += `${sub.title}\n`;
                    }
                });
                tempLog += "\n";
            });

            if (projHasData) {
                finalLog += tempLog;
            }
        });

        // 익일 예정 업무에 커서를 두고 추가 작성할 수 있도록 텍스트 박스에 세팅
        if(!hasIncomplete) {
            tomorrowText += "- (내일 진행할 업무를 여기에 작성하세요)\n";
        }

        const outputBox = document.getElementById('finalOutput');
        outputBox.value = finalLog.trim() + "\n" + tomorrowText;
        
        document.getElementById('resultSection').style.display = 'block';
        outputBox.scrollIntoView({ behavior: 'smooth' });
    }
</script>
</body>
</html>
