<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WORK-space</title>
    <style>
        /* 깔끔하고 모던한 컬러 팔레트 */
        :root {
            --text-main: #2d3436;
            --text-gray: #636e72;
            --bg-page: #f8f9fa;
            --bg-card: #ffffff;
            --bg-hover: #f1f2f6;
            --border-color: #dfe6e9;
            --primary: #0984e3;
            --primary-hover: #74b9ff;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
            --shadow-md: 0 8px 24px rgba(0,0,0,0.06);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, "Apple Color Emoji", Arial, sans-serif;
            color: var(--text-main);
            background-color: var(--bg-page);
            line-height: 1.6;
            margin: 0;
            padding: 40px 20px;
        }
        .container {
            max-width: 850px;
            margin: 0 auto;
        }
        
        /* 타이포그래피 */
        h1 { 
            font-size: 36px; 
            font-weight: 800; 
            margin-bottom: 30px; 
            letter-spacing: -0.02em; 
            color: var(--text-main);
            text-align: center;
        }
        h2 { 
            font-size: 20px; 
            font-weight: 700; 
            margin-top: 0; 
            margin-bottom: 20px;
            color: var(--text-main);
        }
        
        /* 둥근 형태의 카드 레이아웃 */
        .card-section {
            background-color: var(--bg-card);
            border-radius: 24px;
            padding: 32px;
            box-shadow: var(--shadow-md);
            margin-bottom: 24px;
        }

        /* 버튼 스타일 (왼쪽 상단 0, 나머지 둥글게) */
        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 0 16px 16px 16px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: var(--shadow-sm);
        }
        .btn:hover { 
            background-color: var(--primary-hover); 
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(9, 132, 227, 0.2);
        }
        .btn-outline { 
            background-color: transparent; 
            border: 2px solid var(--border-color); 
            color: var(--text-gray); 
            box-shadow: none;
        }
        .btn-outline:hover { 
            background-color: var(--bg-hover); 
            border-color: #b2bec3;
            color: var(--text-main);
        }

        /* 텍스트 입력창 (둥근 레이아웃) */
        textarea {
            width: 100%;
            padding: 20px;
            border: 2px solid var(--border-color);
            border-radius: 16px;
            font-family: inherit;
            font-size: 15px;
            resize: vertical;
            background-color: #fafbfc;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s ease;
        }
        textarea:focus { 
            border-color: var(--primary); 
            background-color: #fff;
        }

        /* 노션 스타일 블록 (Task Board) - 둥근 느낌 강화 */
        .project-block { margin-top: 20px; margin-bottom: 32px; }
        .project-title { 
            font-size: 18px; 
            font-weight: 700; 
            padding: 8px 16px; 
            color: var(--primary); 
            background-color: rgba(9, 132, 227, 0.08);
            border-radius: 12px;
            display: inline-block;
            margin-bottom: 16px;
        }
        
        .task-card {
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 20px;
            margin: 0 0 16px 0;
            background-color: #fff;
            box-shadow: var(--shadow-sm);
            transition: transform 0.2s ease;
        }
        .task-card:hover {
            border-color: #b2bec3;
        }
        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
            font-size: 16px;
            margin-bottom: 16px;
        }
        .progress-control {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
        }
        input[type="range"] { 
            accent-color: var(--primary); 
            cursor: pointer; 
            width: 120px;
        }
        
        .subtask-list { margin-top: 12px; }
        .subtask-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            border-radius: 12px;
            font-size: 15px;
            margin-bottom: 4px;
            transition: background-color 0.2s;
        }
        .subtask-item:hover { background-color: var(--bg-hover); }
        .subtask-item::before { content: "•"; color: var(--primary); margin-right: 12px; font-weight: bold;}
        
        select {
            padding: 6px 12px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: white;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-main);
            cursor: pointer;
            outline: none;
            transition: all 0.2s;
        }
        select:focus { border-color: var(--primary); }

        /* 컨트롤 패널 영역 */
        .action-panel {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 20px;
        }

        /* 헬퍼 텍스트 */
        .helper-text {
            color: var(--text-gray); 
            font-size: 14px; 
            margin-bottom: 16px;
            background-color: var(--bg-hover);
            padding: 12px 16px;
            border-radius: 12px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>WORK-space</h1>

    <!-- 1. 입력 영역 -->
    <div id="inputSection" class="card-section">
        <h2>업무 계획 입력</h2>
        <div class="helper-text">
            ✍️ 텍스트 양식에 맞춰 오늘 할 일을 입력하세요. (예: [사업명] 엔터 / 1. 업무명 엔터 / - 세부작업)
        </div>
        <textarea id="rawInput" style="height: 240px;" placeholder="[경북대 IP명품 콘텐츠]
1. IP명품 지식재산 배경지 제작
- 검토후 obs 삽입

[내부업무]
1. 유튜브 자체 컨텐츠 제작 진행
- 나레이션 작업
- ai 영상 구현
- 제작 후 업로드 진행"></textarea>
        
        <div class="action-panel">
            <button class="btn" onclick="transformToBlocks()">블록으로 변환하기 ➔</button>
        </div>
    </div>

    <!-- 2. 변환된 보드 영역 -->
    <div id="boardSection" class="card-section" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; border-bottom: 2px solid var(--bg-hover); padding-bottom: 16px;">
            <h2>업무 트래커</h2>
            <div style="display: flex; gap: 10px;">
                <button class="btn btn-outline" onclick="editRawText()">텍스트 수정</button>
                <button class="btn" onclick="generateFinalLog()">오늘의 일지 쓰기 ➔</button>
            </div>
        </div>
        <div id="blockContainer"></div>
    </div>

    <!-- 3. 결과 및 익일 업무 작성 영역 -->
    <div id="resultSection" class="card-section" style="display: none;">
        <h2>일지 출력 및 익일 예정 업무</h2>
        <textarea id="finalOutput" style="height: 400px;"></textarea>
    </div>
</div>

<script>
    // 날짜 포맷팅 함수 (YYYY-MM-DD)
    function getFormattedDate(offsetDays = 0) {
        const d = new Date();
        d.setDate(d.getDate() + offsetDays);
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${day}`;
    }

    const todayStr = getFormattedDate(0);
    const tomorrowStr = getFormattedDate(1);
    
    let parsedData = [];

    // 1. 텍스트를 인식하여 데이터로 변환
    function transformToBlocks() {
        const text = document.getElementById('rawInput').value;
        const lines = text.split(/\r?\n/);
        
        parsedData = [];
        let currentProj = null;
        let currentTask = null;

        for (let i = 0; i < lines.length; i++) {
            const line = lines[i].trim();
            if (!line) continue; 

            if (line.startsWith('[') && line.endsWith(']')) {
                currentProj = { title: line, tasks: [] };
                parsedData.push(currentProj);
            } 
            else if (/^\d+\./.test(line)) {
                currentTask = { title: line, progress: 0, subtasks: [] };
                if (currentProj) currentProj.tasks.push(currentTask);
            } 
            else if (line.startsWith('-')) {
                if (currentTask) currentTask.subtasks.push({ title: line, status: '대기' });
            }
        }

        if (parsedData.length === 0) {
            alert("인식할 수 있는 데이터가 없습니다. 양식을 확인해주세요.");
            return;
        }

        renderBlocks();
        document.getElementById('inputSection').style.display = 'none';
        document.getElementById('boardSection').style.display = 'block';
        document.getElementById('resultSection').style.display = 'none';
    }

    // 2. 파싱된 데이터를 UI 블록으로 렌더링
    function renderBlocks() {
        const container = document.getElementById('blockContainer');
        container.innerHTML = '';

        parsedData.forEach((proj, pIdx) => {
            let html = `<div class="project-block"><div class="project-title">${proj.title}</div>`;
            
            proj.tasks.forEach((task, tIdx) => {
                let subHtml = task.subtasks.map((sub, sIdx) => `
                    <div class="subtask-item">
                        <span style="flex:1;">${sub.title}</span>
                        <select id="status_${pIdx}_${tIdx}_${sIdx}" onchange="syncProgress(${pIdx}, ${tIdx})">
                            <option value="대기" selected>대기</option>
                            <option value="진행 중">진행 중</option>
                            <option value="완료">완료</option>
                        </select>
                    </div>
                `).join('');

                html += `
                    <div class="task-card">
                        <div class="task-header">
                            <span>${task.title}</span>
                            <div class="progress-control">
                                <input type="range" id="prog_${pIdx}_${tIdx}" min="0" max="100" step="10" value="0" 
                                       oninput="document.getElementById('progText_${pIdx}_${tIdx}').innerText = this.value + '%'">
                                <span id="progText_${pIdx}_${tIdx}" style="width: 45px; text-align: right; font-weight:800; color: var(--primary);">0%</span>
                            </div>
                        </div>
                        <div class="subtask-list">
                            ${subHtml}
                        </div>
                    </div>
                `;
            });
            html += `</div>`;
            container.innerHTML += html;
        });
    }

    // 다시 입력창으로 돌아가는 함수
    function editRawText() {
        document.getElementById('boardSection').style.display = 'none';
        document.getElementById('resultSection').style.display = 'none';
        document.getElementById('inputSection').style.display = 'block';
    }

    // 하위 작업 상태에 따른 퍼센트 자동 반영
    function syncProgress(pIdx, tIdx) {
        const task = parsedData[pIdx].tasks[tIdx];
        const subtasksCount = task.subtasks.length;
        
        if (subtasksCount === 0) return;

        let totalScore = 0;

        for (let sIdx = 0; sIdx < subtasksCount; sIdx++) {
            const status = document.getElementById(`status_${pIdx}_${tIdx}_${sIdx}`).value;
            if (status === '완료') {
                totalScore += 100;
            } else if (status === '진행 중') {
                totalScore += 50;
            } 
        }

        let averageProgress = totalScore / subtasksCount;
        averageProgress = Math.round(averageProgress / 10) * 10;

        document.getElementById(`prog_${pIdx}_${tIdx}`).value = averageProgress;
        document.getElementById(`progText_${pIdx}_${tIdx}`).innerText = averageProgress + '%';
    }

    // 3. 오늘의 일지 및 익일 업무 생성 로직
    function generateFinalLog() {
        let finalLog = "";
        let tomorrowText = "\n[익일예정업무]\n";
        let hasIncomplete = false;

        parsedData.forEach((proj, pIdx) => {
            let projHasData = false;
            let tempLog = `${proj.title}\n`;
            
            proj.tasks.forEach((task, tIdx) => {
                projHasData = true;
                const progress = document.getElementById(`prog_${pIdx}_${tIdx}`).value;
                
                let dateStr = "";
                if (progress === "100") {
                    dateStr = `시작 ${todayStr} / 마감 ${todayStr}`;
                } else {
                    dateStr = `시작 ${todayStr} / 마감 (완료 예정) ${tomorrowStr}`;
                    tomorrowText += `${task.title}\n`;
                    hasIncomplete = true;
                }

                tempLog += `${task.title} ${progress}%\n${dateStr}\n`;

                task.subtasks.forEach((sub, sIdx) => {
                    const status = document.getElementById(`status_${pIdx}_${tIdx}_${sIdx}`).value;
                    tempLog += `${sub.title} ${status}\n`;
                    
                    if (progress !== "100" && status !== '완료') {
                        tomorrowText += `${sub.title}\n`;
                    }
                });
                tempLog += "\n";
            });

            if (projHasData) {
                finalLog += tempLog;
            }
        });

        if(!hasIncomplete) {
            tomorrowText += "- (내일 진행할 업무를 여기에 작성하세요)\n";
        }

        const outputBox = document.getElementById('finalOutput');
        outputBox.value = finalLog.trim() + "\n" + tomorrowText;
        
        document.getElementById('resultSection').style.display = 'block';
        outputBox.scrollIntoView({ behavior: 'smooth' });
    }
</script>
</body>
</html>
